<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="scoreTitle scoreDesc">
  <title id="scoreTitle">How a credit score comes together</title>
  <desc id="scoreDesc">
    A stacked-bar diagram of the five parts of a typical credit score:
    payment history 35%, amounts owed 30%, length of history 15%,
    new credit 10%, and credit mix 10%.
  </desc>

  <!-- background -->
  <rect width="760" height="400" fill="#ffffff"/>

  <text x="32" y="44" font-family="Georgia, serif" font-size="21" fill="#333330">
    How your credit score comes together
  </text>
  <text x="32" y="66" font-family="Georgia, serif" font-size="13" fill="#6d6660" font-style="italic">
    Typical weighting for a common scoring model — other models shift the numbers a little.
  </text>

  <!-- rows: label | bar | sub-question under bar -->
  <!-- 1. Payment history 35% -->
  <text x="32" y="112" font-family="Georgia, serif" font-size="15" fill="#333330">Payment history</text>
  <rect x="180" y="96" width="330" height="26" rx="8" fill="#2f6b5f"/>
  <text x="520" y="115" font-family="Georgia, serif" font-size="17" fill="#333330">35%</text>
  <text x="180" y="140" font-family="Georgia, serif" font-size="12.5" fill="#6d6660">Do bills arrive on time? (The biggest single piece.)</text>

  <!-- 2. Amounts owed 30% -->
  <text x="32" y="176" font-family="Georgia, serif" font-size="15" fill="#333330">Amounts owed</text>
  <rect x="180" y="160" width="283" height="26" rx="8" fill="#417a6b"/>
  <text x="520" y="179" font-family="Georgia, serif" font-size="17" fill="#333330">30%</text>
  <text x="180" y="204" font-family="Georgia, serif" font-size="12.5" fill="#6d6660">How much of your credit limits are you using? Lower is better.</text>

  <!-- 3. Length of history 15% -->
  <text x="32" y="240" font-family="Georgia, serif" font-size="15" fill="#333330">Length of history</text>
  <rect x="180" y="224" width="141" height="26" rx="8" fill="#548a77"/>
  <text x="520" y="243" font-family="Georgia, serif" font-size="17" fill="#333330">15%</text>
  <text x="180" y="268" font-family="Georgia, serif" font-size="12.5" fill="#6d6660">How long your accounts have been open (average age counts).</text>

  <!-- 4. New credit 10% -->
  <text x="32" y="304" font-family="Georgia, serif" font-size="15" fill="#333330">New credit</text>
  <rect x="180" y="288" width="94" height="26" rx="8" fill="#6c9c8b"/>
  <text x="520" y="307" font-family="Georgia, serif" font-size="17" fill="#333330">10%</text>
  <text x="180" y="332" font-family="Georgia, serif" font-size="12.5" fill="#6d6660">How many accounts were opened or applied for recently.</text>

  <!-- 5. Credit mix 10% -->
  <text x="32" y="368" font-family="Georgia, serif" font-size="15" fill="#333330">Credit mix</text>
  <rect x="180" y="352" width="94" height="26" rx="8" fill="#6c9c8b"/>
  <text x="520" y="371" font-family="Georgia, serif" font-size="17" fill="#333330">10%</text>
  <text x="180" y="396" font-family="Georgia, serif" font-size="12.5" fill="#6d6660">A blend of account types (like a card plus an installment loan) helps a little.</text>
</svg>
